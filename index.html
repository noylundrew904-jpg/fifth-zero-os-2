<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fifth Zero OS</title>
<link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div class="auth-wrap" id="authWrap">
  <div class="auth-card">
    <div class="auth-title serif">Fifth Zero OS</div>
    <div class="auth-sub" id="authSub">Sign in to your operating system</div>
    <form id="authForm">
      <div class="field"><label>Email</label><input type="email" id="authEmail" required /></div>
      <div class="field"><label>Password</label><input type="password" id="authPassword" required minlength="6" /></div>
      <div class="error-text" id="authError"></div>
      <button class="btn btn-primary" id="authSubmit" style="width:100%;justify-content:center;margin-top:6px;">Sign in</button>
    </form>
    <button class="auth-toggle" id="authToggle">Don't have an account? Sign up</button>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div class="app-shell" id="appShell">
  <aside class="sidebar">
    <div class="brand">
      <img src="images/favicon.svg" alt="" />
      <span class="brand-text">Fifth Zero</span>
    </div>
    <nav class="nav-list" id="navList"></nav>
    <div class="userbox">
      <div class="avatar" id="userAvatar">N</div>
      <div class="userbox-email" id="userEmail"></div>
      <button class="signout" id="signOutBtn">Sign out</button>
    </div>
  </aside>
  <main class="main"><div class="page" id="pageRoot"></div></main>
</div>

<!-- Supabase JS client (UMD build via CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
