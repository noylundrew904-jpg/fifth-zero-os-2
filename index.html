<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b0b0f" />
<title>Fifth &amp; Zero OS</title>
<link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="images/logo.svg" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ============ APP SHELL ============ -->
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <img src="images/favicon.svg" alt="" />
      <span class="brand-text">Fifth &amp; Zero</span>
    </div>
    <div class="search-host" id="searchHost"></div>
    <nav class="nav-list" id="navList"></nav>
  </aside>
  <main class="main">
    <div class="page" id="pageRoot"></div>
  </main>
</div>

<!-- ============ SCRIPTS ============
     Plain scripts (no bundler, no ES modules) so the app runs by simply
     opening index.html — every file attaches to the shared FZ namespace.
     Load order matters: data/utils first, components next, modules after,
     script.js (bootstrap + router) last. -->
<script src="data/storage.js"></script>
<script src="utils/id.js"></script>
<script src="utils/format.js"></script>
<script src="utils/dom.js"></script>
<script src="utils/markdown.js"></script>
<script src="utils/archive.js"></script>
<script src="utils/recurrence.js"></script>
<script src="utils/chart.js"></script>

<script src="components/toast.js"></script>
<script src="components/modal.js"></script>
<script src="components/confirm.js"></script>
<script src="components/deleteFlow.js"></script>
<script src="components/form.js"></script>
<script src="components/card.js"></script>
<script src="components/listRow.js"></script>
<script src="components/search.js"></script>
<script src="components/sidebar.js"></script>

<script src="modules/tasks.js"></script>
<script src="modules/finance.js"></script>
<script src="modules/clients.js"></script>
<script src="modules/projects.js"></script>
<script src="modules/health.js"></script>
<script src="modules/habits.js"></script>
<script src="modules/knowledge.js"></script>
<script src="modules/calendar.js"></script>
<script src="modules/archive.js"></script>
<script src="modules/settings.js"></script>
<script src="modules/analytics.js"></script>
<script src="modules/dashboard.js"></script>

<script src="script.js"></script>
</body>
</html>
